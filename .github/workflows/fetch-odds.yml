name: Fetch & Upload Daily Odds

on:
  # Cada 2 horas, las 24 horas — antes corría 1 vez/día a las 11am ET, dejando
  # el bucket con los juegos/resultados de la corrida anterior toda la mañana.
  schedule:
    - cron: '0 */2 * * *'

  # Allow running manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch odds & upload to Supabase
        env:
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/fetch-odds.mjs
